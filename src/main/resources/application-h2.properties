spring.datasource.url=jdbc:h2:mem:trustvault_db;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
app.upload.dir=${APP_UPLOAD_DIR:uploads}
app.jwt.secret=${APP_JWT_SECRET:TrustVaultSuperSecretKeyForJwtSigningMustBeAtLeast256BitsLong2026!}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}
server.port=${PORT:${SERVER_PORT:10000}}
server.address=0.0.0.0
spring.main.lazy-initialization=false
spring.jmx.enabled=false
spring.mvc.welcome-page.enabled=false
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
