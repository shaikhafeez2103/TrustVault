spring.application.name=trustvault
server.port=${PORT:${SERVER_PORT:10000}}
server.address=0.0.0.0
spring.main.lazy-initialization=false
spring.jmx.enabled=false

# Actuator Health Check for Render
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Active Profile: change to 'mysql' for dedicated production MySQL, or 'h2' for standalone evaluation
spring.profiles.active=${SPRING_PROFILES_ACTIVE:h2}

# MySQL Configuration (Default)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/trustvault_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# File Upload Configuration
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB
app.upload.dir=${APP_UPLOAD_DIR:uploads}

# Security & JWT Configuration
app.jwt.secret=${APP_JWT_SECRET:TrustVaultSuperSecretKeyForJwtSigningMustBeAtLeast256BitsLong2026!}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

# Google OAuth 2.0 / OpenID Connect Configuration
app.oauth2.google.client-id=${GOOGLE_CLIENT_ID:}
app.oauth2.google.client-secret=${GOOGLE_CLIENT_SECRET:}
app.oauth2.google.redirect-uri=${GOOGLE_REDIRECT_URI:https://trustvault-pxqr.onrender.com/login/oauth2/code/google}

# Logging
logging.level.com.trustvault=INFO
logging.level.org.springframework.security=WARN
