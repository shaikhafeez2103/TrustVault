spring.application.name=trustvault
server.port=8080

# Active Profile: change to 'mysql' for dedicated production MySQL, or 'h2' for standalone evaluation
spring.profiles.active=mysql

# MySQL Configuration (Default)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/trustvault_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# File Upload Configuration
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB
app.upload.dir=uploads

# Security & JWT Configuration
app.jwt.secret=TrustVaultSuperSecretKeyForJwtSigningMustBeAtLeast256BitsLong2026!
app.jwt.expiration-ms=86400000

# Logging
logging.level.com.trustvault=INFO
logging.level.org.springframework.security=WARN
