<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="0; url=login.html">
  <title>TrustVault - Redirecting to Login...</title>
  <script>
    (function() {
      var token = localStorage.getItem('trustvault_token') || sessionStorage.getItem('trustvault_token');
      if (token) {
        window.location.replace('dashboard.html');
      } else {
        window.location.replace('login.html');
      }
    })();
  </script>
</head>
<body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; text-align: center; padding: 4rem 1rem; color: #475569; background: #0b0f19;">
  <p style="color: #94a3b8; font-size: 1rem;">Redirecting to TrustVault Secure Portal...</p>
  <p><a href="login.html" style="color: #3b82f6; text-decoration: none; font-weight: 600;">Click here if not redirected automatically</a></p>
</body>
</html>
